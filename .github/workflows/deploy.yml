name: deploy

# Auto-deploys lingo-async Lambda code on every push to main.
# Terraform owns infra (queues, IAM, event source mapping, memory, timeout);
# this workflow owns code.
# Auth: GitHub OIDC -> ci-lingo-async IAM role (no stored AWS keys).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required to mint the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build zip
        run: ./scripts/build-zip.sh
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::349654078389:role/ci-lingo-async
          aws-region: us-west-1
      - name: update lambda code
        # --query limits output to safe fields; the default output dumps the
        # full function config INCLUDING environment variables into the log.
        run: |
          aws lambda update-function-code \
            --function-name lingo-async \
            --zip-file fileb://dist/lingo-async.zip \
            --publish \
            --query '{Version: Version, CodeSha256: CodeSha256, LastModified: LastModified}'
      - name: wait for code update
        run: |
          aws lambda wait function-updated --function-name lingo-async
