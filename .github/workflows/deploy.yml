name: deploy

# Auto-deploys lingo-async Lambda code on every push to main.
# Terraform owns infra (queues, IAM, event source mapping, memory, timeout);
# this workflow owns code. Requires org secrets: AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, AWS_REGION.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build zip
        run: ./scripts/build-zip.sh
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1
      - name: update lambda code
        run: |
          aws lambda update-function-code \
            --function-name lingo-async \
            --zip-file fileb://dist/lingo-async.zip \
            --publish
      - name: wait for code update
        run: |
          aws lambda wait function-updated --function-name lingo-async
